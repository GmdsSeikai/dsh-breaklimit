function patchesView(){

 return `<div class="page-heading"><div class="grow"><h2>选择你需要的改动</h2><p>先挑选，再统一应用。关闭开关会保留已写入的源码改动。</p></div>${badge(`${enabledPatches().length} 条已选`,'blue')}</div>${S.blocked?`<div class="mb">${notice('预检发现一处不一致','宿主源码可能被其他工具修改，或版本不匹配。为保护现有改动，本次不会写入任何文件。','error',btn('查看具体原因','blockedHelp','sm')+btn('重新检查','refresh','sm'))}</div>`:''}${!S.root?`<div class="mb">${notice('还无法进行预检','先配置宿主源码目录。','warn',btn('查看配置步骤','configureRoot','sm'))}</div>`:''}<div class="section-label"><span>源码补丁</span><span>当前提示词模式：${modeName(S.mode)}</span></div><section class="patch-list" aria-label="补丁清单">${patches.map(p=>{
 const eligible=!p.unrestricted||S.mode==='unrestricted',selected=S.selected.has(p.id)&&eligible,applied=S.applied.has(p.id)&&!(p.id==='output.trim'&&S.diskMode!==S.mode),disk=!S.root?'未检查':S.blocked&&p.id==='read.limits'?'有冲突':applied?'已就位':selected?'待写入':'未应用';
 return `<article class="patch-row ${!eligible?'inactive':''}"><div class="patch-top"><div class="patch-icon">${icon(p.icon)}</div><div class="grow"><h3>${p.name}${p.unrestricted?badge('仅完全解放'):''}</h3><p class="description">${p.desc}</p><div class="patch-meta">${badge(disk,disk==='已就位'?'green':disk==='待写入'?'blue':disk==='有冲突'?'red':'')}<span>${p.files.length} 个文件</span>${!eligible?'<button class="link small" data-page="prompt">查看模式</button>':''}</div><details class="disclosure"><summary>改动说明与文件</summary><p>${p.detail}</p>${fileList(p.files)}<p class="mono">${p.id}</p></details></div><div class="patch-switch"><button class="switch" role="switch" aria-label="选择${p.name}" aria-checked="${selected}" data-patch="${p.id}" ${!eligible||S.busy?'disabled':''}><span></span></button><span>${!eligible?'当前不可选':selected?'已选择':'未选择'}</span></div></div></article>`;
 }).join('')}</section><footer class="sticky-footer"><div class="foot-copy"><strong>${S.blocked?'预检未通过':count?`预计写入 ${count} 个文件`:'没有待写入文件'}</strong><span id="apply-reason">${reason||'写入前会保存快照；完成后需要重启宿主。'}</span></div>${btn(icon('undo')+'回退已应用补丁','revert','quiet',`aria-describedby="apply-reason" ${!S.applied.size||S.busy||S.blocked||!S.root?'disabled':''}`)}${btn(S.busy?'<span class="spinner"></span>正在处理…':`检查并应用${count?' · '+count+' 个文件':''}`,'apply','primary',`aria-describedby="apply-reason" ${reason?'disabled':''}`)}</footer>`;
}

function promptView(){return `<div class="page-heading"><div><h2>让模型按你的方式协作</h2><p>选择附加指令模式，或编辑两档共用的正文。</p></div></div><div class="stack"><section><div class="section-label"><strong>提示词模式</strong><span>下一轮对话生效</span></div>${modeCards()}<p class="reason mt">两档共用同一份正文。模式也会调整执行层上限，但不会降低实际沙箱权限。</p></section>${S.promptNotice?notice(S.promptNotice.title,S.promptNotice.body,S.promptNotice.tone):''}${S.readError?notice('共用正文读取失败','当前内容未知，不能当作空正文或内置正文。为避免覆盖，保存与重置已暂停。','error',btn('重新读取','retryRead','sm')):''}<section class="editor-card"><div class="editor-head">${icon('text')}<h3>共用正文</h3><span class="grow"></span>${badge(S.readError?'读取失败':S.promptCustom?'自定义正文':'内置正文',S.readError?'red':'')}<button class="link small" data-action="promptHelp" aria-label="了解共用正文">${icon('help')}</button></div><div class="editor-body"><label class="sr-only" for="prompt-text">共用正文</label><textarea id="prompt-text" class="control" spellcheck="false" ${S.readError?'disabled':''} aria-describedby="prompt-description">${esc(S.readError?'':promptValue())}</textarea><p class="field-hint mt" id="prompt-description">${S.readError?'重新读取成功后，正文会出现在这里。':'保存会替换内置正文，模式各自的附加段不受影响。'}</p></div><div class="editor-footer"><span id="prompt-count">${S.readError?'内容未知':promptValue().length+' 字 · '+new TextEncoder().encode(promptValue()).length+' 字节'}</span><span class="grow"></span><span id="prompt-dirty">${promptDirty()?badge('有未保存修改','amber'):S.readError?'尚未读取':icon('check')+' 已保存'}</span>${btn(icon('copy')+'复制全文','copyPrompt','sm quiet',S.readError?'disabled':'')}</div><div class="editor-actions"><div class="row between"><div>${btn('恢复内置','resetPrompt','sm danger-quiet',S.readError||!S.promptCustom||S.busy?'disabled':'')}</div><div class="row gap8">${btn('放弃修改','discardPrompt','sm quiet',!promptDirty()||S.busy?'disabled':'')}${btn(S.busy?'<span class="spinner"></span>保存中…':'保存正文','savePrompt','primary',!promptDirty()||S.readError||S.busy||!promptValue().trim()?'disabled':'')}</div></div><p class="reason" id="prompt-reason">${S.readError?'读取成功后才能保存。':S.busy?'正在保存已提交的内容，你可以继续编辑；新输入会保留。':promptDirty()?!promptValue().trim()?'正文不能为空；恢复内置请使用左侧按钮。':'有未保存的修改，保存后从下一轮对话生效。':'没有改动，无需保存。'}</p></div></section></div>`}
function rulesView(){
 if(S.corrupt)return `<div class="page-heading"><div><h2>规则需要先恢复</h2><p>先保护已有内容，再重新开始管理。</p></div></div>${notice('规则清单无法读取或版本不符','插件已暂停规则写入。已有正文仍在 bodies/ 目录；重置清单不会自动找回原激活关系。','error')}<section class="card mt"><h3>先备份，再重置清单</h3><p class="small muted mt">此操作会备份当前 rules.json，并建立空清单。原正文仍保留，但恢复出的同名规则可能覆盖旧正文，建议先手动核对与备份。</p><div class="path">$DSH_HOME/breaklimit/rules.json<br>$DSH_HOME/breaklimit/bodies/</div><div class="row mt">${btn('备份并重置清单','recoverRules','primary')}${btn('查看保留的数据','recoveryHelp','quiet')}</div></section>`;

function ruleSummary(){const r=selectedRule();return `<section class="card"><div class="row between"><h3>${esc(r.name||r.id)}</h3>${badge(S.active===r.id?'激活中':'未激活',S.active===r.id?'green':'')}</div><p class="small muted mt">${S.active===r.id?'这份规则已写入 '+esc(r.target)+'，保存编辑内容会同步到该文件。':'这份规则已保存。激活后才会写入 '+esc(r.target)+'。'}</p><pre class="path" style="white-space:pre-wrap;min-height:125px">${esc(r.text)}</pre><div class="rule-actions">${btn(icon('text')+'编辑规则','editCurrent')}${btn(S.active===r.id?'取消激活':'激活这条规则','activeCurrent',S.active===r.id?'':'primary',S.busy?'disabled':'')}${btn(icon('trash')+'删除','deleteCurrent','danger-quiet',S.busy?'disabled':'')}</div></section>`}
function validateRule(){const r=S.editing;if(!r)return '';if(!r.id.trim())return '先填写规则 ID。';if(!/^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$/.test(r.id))return 'ID 需以字母或数字开头，只能含字母、数字、点、下划线或连字符，最多 64 字符。';if(!r.text.trim())return '先写下规则正文。';return ''}

const WORD_LIMIT=100,WORD_TERM_LIMIT=64;
const wordsLocked=()=>S.wordsReadError||S.wordReadLoading||S.wordSaving||S.busy;
const wordsDraftDirty=()=>!!(S.aliasFrom||S.aliasTo)||(S.wordEditor!==null&&(S.wordEditor.from!==S.wordEditor.baseline.from||S.wordEditor.to!==S.wordEditor.baseline.to));
function wordErrors(from,to,originalFrom=null){
 const source=from.trim(),target=to.trim(),errors={from:'',to:'',limit:''};
 if(!source)errors.from='请填写原词。';
 else if(source.length>WORD_TERM_LIMIT)errors.from='原词最多 64 个字符。';
 if(!target)errors.to='请填写替换词。';
 else if(target.length>WORD_TERM_LIMIT)errors.to='替换词最多 64 个字符。';
 else if(source===target)errors.to='原词与替换词不能相同。';
 if(originalFrom===null&&S.alias.length>=WORD_LIMIT&&!S.alias.some(a=>a.from===source))errors.limit='词库已达到 100 条，请先编辑或删除已有词条。';
 return errors;
}
const firstWordError=errors=>errors.from||errors.to||errors.limit;
// Same literal, stable long-term-first replacement semantics as host/masks.js.
function maskPreview(text,entries){
 const normalized=[],seen=new Map();
 for(const entry of entries){
  const from=entry.from.trim(),to=entry.to.trim();
  if(!from||!to||from===to||from.length>WORD_TERM_LIMIT||to.length>WORD_TERM_LIMIT)continue;
  if(seen.has(from))normalized[seen.get(from)]={from,to};
  else{seen.set(from,normalized.length);normalized.push({from,to})}
 }
 const ordered=normalized.slice(0,WORD_LIMIT).sort((a,b)=>b.from.length-a.from.length);
 let result=text;const matched=[];
 for(const entry of ordered){if(!result.includes(entry.from))continue;result=result.split(entry.from).join(entry.to);matched.push(entry.from)}
 return {text:result,matched};
}
function wordsPreviewContent(){

 const result=maskPreview(S.wordsPreview,S.alias);
 return {output:result.text,summary:!S.alias.length?'词库为空，添加并保存后可以试用。':!S.wordsPreview?'输入一段示例文字。':result.matched.length?`命中 ${result.matched.length} 个词条，仅为本地预览。`:'没有词条匹配这段文本。',matches:result.matched};
}

}

function updateWordsPreview(){const p=wordsPreviewContent();$('#word-preview-output').textContent=p.output;$('#word-preview-summary').textContent=p.summary;$('#word-preview-matches').innerHTML=wordMatchContent(p.matches)}
function restoreWordFocus(from){const index=S.alias.findIndex(a=>a.from===from);const node=index>=0?document.getElementById('word-edit-'+index):null;(node||$('#word-add')||$('.dock-trigger')||$('#main'))?.focus({preventScroll:true})}
function openWordEditor(index=null){

 S.wordEditor={...base,baseline:{...base},originalFrom:existing?.from??null,phase:'edit',error:null,touched:false};

function updateWordEditor(){

function requestCloseWordEditor(){

function requestWordSave(){

 if(duplicate){editor.phase='overwrite';renderWordEditor();return}

function changedWordList(entry,originalFrom){

 if(duplicate>=0&&duplicate!==original)return S.alias.filter((a,index)=>index!==original).map(a=>a.from===entry.from?entry:a);

async function persistWords(next,source,focusFrom,success){

  S.failWordsSave=false;

  if(S.wordEditor){S.wordEditor.phase='edit';S.wordEditor.error=message;render();renderWordEditor(true)}
  else{S.wordNotice={title:'词库保存失败，改动未生效',body:message,tone:'error'};render()}

 case 'saveRule':{if(validateRule()||!ruleDirty())break;const submitted={...ruleFields(S.editing)},original=JSON.stringify(ruleFields(S.editing));const save=()=>simulate(()=>{if(S.failSave){S.failSave=false;S.ruleNotice={title:'保存失败，草稿已保留',body:'示例写入失败，请检查后重试。',tone:'error'};return}S.selectedRuleId=submitted.id;const index=S.rules.findIndex(r=>r.id===submitted.id);index===-1?S.rules.push(submitted):S.rules.splice(index,1,submitted);if(S.editing&&JSON.stringify(ruleFields(S.editing))===original)S.editing=null;else if(S.editing?.id===submitted.id){S.editing.baseline={...submitted};S.editing.isNew=false;S.editing.originalId=submitted.id}S.ruleNotice={title:S.active===submitted.id?'规则已保存并同步到写入文件':'规则已保存，还没有激活',body:S.active===submitted.id?`已模拟同步到 ${submitted.target}。`: '保存不会自动生效，激活后才会写入指令文件。',tone:'success',activate:S.active===submitted.id?null:submitted.id};toast('规则已保存')});if(S.editing.isNew&&S.rules.some(r=>r.id===submitted.id))showDialog({title:`覆盖已有规则「${esc(submitted.id)}」？`,body:'<p>名称、正文和目标文件会替换原规则；旧正文无法直接找回。如果想保留两份，请取消后修改 ID。</p>',yes:'确认覆盖',danger:true,onAccept:save});else save();break}
 case 'recoverRules':showDialog({title:'备份并重置规则清单？',body:'<p>先备份损坏的 rules.json，再初始化空清单。已有 bodies/ 正文不会删除，但原规则名称、激活状态与文件恢复关系不会自动找回。</p>'+notice('重建同名规则前先备份正文','同 ID 保存会覆盖 bodies/ 下的原正文。','warn'),yes:'备份并重置',danger:true,onAccept:()=>simulate(()=>{S.corrupt=false;S.rules=[];S.active=null;S.editing=null;S.ruleNotice={title:'已备份原清单，并重置为空清单',body:'演示备份位置：$DSH_HOME/dsh-breaklimit-backup/示例恢复批次/rules.json。原正文仍在 bodies/ 中；请先核对与备份，再创建规则。',tone:'success'};toast('模拟恢复完成，原正文保留')})});break;
 case 'recoveryHelp':showDialog({title:'哪些数据仍然保留？',body:'<p>损坏的清单会在重置前单独备份，正文文件仍保留。不要把空清单当作旧规则已经恢复，也不要在未备份前保存同 ID 的新规则。</p><div class="path">$DSH_HOME/breaklimit/bodies/&lt;规则 ID&gt;.md<br>$DSH_HOME/dsh-breaklimit-backup/&lt;恢复批次&gt;/rules.json</div>'});break;
 case 'rulesHelp':showDialog({title:'保存、激活和取消激活',body:'<p><strong>保存：</strong>保留规则正文，未激活的新规则不会改动指令文件。</p><p class="mt small muted"><strong>激活：</strong>先备份目标文件，再写入规则，同一时间仅激活一条。</p><p class="mt small muted"><strong>取消激活：</strong>目标未被外部改动时恢复原文；外部修改会保留并报告。</p>'});break;
 case 'promptHelp':showDialog({title:'共用正文是什么？',body:'<p>这是两档提示词模式共用的附加指令。保存自定义版本后替换内置正文，模式特有的附加段仍然保留。</p><p class="small muted mt">原型中的正文仅用于评审编辑体验，不代表插件的完整内置提示词。</p>'});break;
 case 'guideHelp':showDialog({title:'从配置到生效',body:'<p>先选择提示词模式，再挑选源码补丁。应用前检查影响与快照，应用后重启同一宿主。</p><div class="info-grid"><div><span>源码补丁</span>写源码，重启宿主后加载</div><div><span>提示词正文与模式</span>下一轮对话生效</div><div><span>长期规则</span>激活后写入指令文件</div><div><span>运行时接管</span>立即生效，不撤销源码补丁</div></div>'+notice('推荐模式不是权限开关','实际执行权限由宿主沙箱档位决定。示例环境为完全权限。','warn')});break;
 case 'addAlias':addDockWord();break;
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dialog').open&&S.dockOpen){S.dockOpen=false;render();$('.dock-trigger')?.focus()}if(e.key==='Enter'&&['word-from','word-to'].includes(e.target.id)){e.preventDefault();requestWordSave()}if(e.key==='Enter'&&['alias-from','alias-to'].includes(e.target.id)){e.preventDefault();$('[data-action=addAlias]')?.click()}});
window.addEventListener('resize',revealSelectedTab);
window.addEventListener('beforeunload',e=>{if(anyDirty()){e.preventDefault();e.returnValue=''}});
S=initial();applyTheme();render();
</script>
</body>
</html>
