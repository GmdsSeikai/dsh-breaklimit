<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>破限 · 前端交互原型</title>
<style>
/* ---------- Tokens ---------- */
:root{color-scheme:light;--bg:#f3f4f7;--surface:#fff;--surface2:#f7f8fa;--surface3:#eceff3;--text:#1d232c;--text2:#4d5765;--text3:#636d7b;--border:#e1e5eb;--strong:#7d8796;--accent:#3157c8;--accentHover:#2647ad;--accentSoft:#edf2ff;--onAccent:#fff;--green:#1f6e4c;--greenSoft:#ebf6ef;--amber:#87570f;--amberSoft:#fff6e5;--red:#b23a41;--redSoft:#fff0f0;--overlay:#18203466;--shadow:0 16px 64px #18203422;--font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei UI",sans-serif;--mono:"Cascadia Mono",Consolas,monospace;
 --accentLine:#c9d6fb;--greenLine:#bfe1cc;--amberLine:#efd39b;--redLine:#f2c4c7;--onDanger:#fff;--shadowSm:0 1px 2px #1820340d,0 2px 10px #18203408;--shadowPop:0 28px 70px -18px #1820344d,0 0 0 1px #18203412;--shadowUp:0 -8px 20px -14px #18203440;--knobShadow:0 1px 2px #18203433;--tooltipBg:#1d232c;--tooltipText:#f3f4f7;--toastIcon:#8dd9b2;--hover:#18203408;--scrollShade:#18203426;
 --fs-app:17px;--fs-page:22px;--fs-section:15px;--fs-label:13px;--fs-help:12px;--fs-body:14px;--fs-micro:11px;
 --gap-field:14px;--gap-label:6px;--gap-block:28px;--pad-card:20px;--pad-row:16px;--radius:10px}
html[data-theme=dark]{color-scheme:dark;--bg:#0f1217;--surface:#171b22;--surface2:#1d222b;--surface3:#272d38;--text:#e8ebf2;--text2:#b6bfcd;--text3:#98a3b5;--border:#2c3340;--strong:#6d7a90;--accent:#9ab1ff;--accentHover:#b4c4ff;--accentSoft:#212c4d;--onAccent:#121d3f;--green:#8dd9b2;--greenSoft:#1a3127;--amber:#f0c27a;--amberSoft:#33291a;--red:#ffa8ab;--redSoft:#3a2228;--overlay:#000a;--shadow:0 16px 64px #0008,0 0 0 1px #ffffff10;
 --accentLine:#3a4c82;--greenLine:#2d5a44;--amberLine:#66512a;--redLine:#73404a;--onDanger:#2b0f14;--shadowSm:0 1px 2px #0006;--shadowPop:0 28px 70px -12px #000c,0 0 0 1px #ffffff1a;--shadowUp:0 -8px 20px -14px #000c;--knobShadow:0 1px 2px #0008;--tooltipBg:#e8ebf2;--tooltipText:#14171d;--toastIcon:#1f6e4c;--hover:#ffffff08;--scrollShade:#000000b3}
html[data-density=compact]{--gap-field:10px;--gap-label:4px;--gap-block:20px;--pad-card:16px;--pad-row:11px;--fs-page:20px}

/* ---------- Base ---------- */
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:var(--fs-body)/1.6 var(--font);-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}button,a,input,textarea,select,summary,[tabindex]{outline-offset:2px}:focus-visible{outline:2px solid var(--accent)}button:disabled{cursor:not-allowed;opacity:.48}button[aria-disabled=true]{cursor:not-allowed;opacity:.55}button,select,input,textarea{transition:background .16s,border-color .16s,box-shadow .16s,color .16s}a{color:var(--accent)}
h1,h2,h3,h4,p{margin:0}h1,h2,h3,h4{overflow-wrap:anywhere;min-width:0}
h1{font-size:var(--fs-app);line-height:1.4;font-weight:650}
h2{font-size:var(--fs-page);line-height:1.35;letter-spacing:-.4px;font-weight:680}
h3{font-size:var(--fs-section);line-height:1.45;font-weight:630}
h4{font-size:var(--fs-label);font-weight:600}
small,.small{font-size:var(--fs-help)}.muted{color:var(--text2)}.subtle{color:var(--text3)}.mono,code,pre{font-family:var(--mono);font-size:12px}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}.stack{display:flex;flex-direction:column;gap:var(--gap-block)}.stack.tight{gap:16px}.gap8{gap:8px}.mt{margin-top:14px}.mb{margin-bottom:16px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.eyebrow{font-size:var(--fs-micro);letter-spacing:.8px;font-weight:650;color:var(--text3);text-transform:uppercase}
.kbd{padding:1px 5px;border:1px solid var(--strong);border-bottom-width:2px;border-radius:4px;font:11px var(--mono);background:var(--surface2)}

/* ---------- Buttons, badges, switch ---------- */
.link{border:0;background:none;color:var(--accent);padding:0;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:550;text-align:left}.link .icon{width:15px;height:15px}.link:hover:not(:disabled){text-decoration:underline;text-underline-offset:3px}
.btn{border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadowSm);border-radius:8px;min-height:34px;padding:6px 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;font-size:13px;font-weight:580;text-decoration:none}.btn .icon{width:16px;height:16px}
.btn:hover:not(:disabled):not([aria-disabled=true]){background:var(--surface2);border-color:var(--strong)}
.btn.primary{color:var(--onAccent);background:var(--accent);border-color:var(--accent)}.btn.primary:hover:not(:disabled){background:var(--accentHover);border-color:var(--accentHover)}
.btn.quiet{border-color:transparent;background:transparent;box-shadow:none;color:var(--text2)}.btn.quiet:hover:not(:disabled){background:var(--surface3);border-color:transparent;color:var(--text)}
.btn.danger{background:var(--red);color:var(--onDanger);border-color:var(--red)}.btn.danger:hover:not(:disabled){background:var(--red);border-color:var(--red);filter:brightness(.93)}
.btn.danger-quiet{color:var(--red);background:transparent;border-color:transparent;box-shadow:none}.btn.danger-quiet:hover:not(:disabled){background:var(--redSoft);border-color:var(--redLine)}
.btn.sm{font-size:12px;min-height:29px;padding:4px 10px}
.icon-btn{border:0;background:transparent;border-radius:7px;padding:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--text2)}.icon-btn:hover:not(:disabled){background:var(--surface3);color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:0 8px;line-height:20px;font-size:var(--fs-micro);font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--text2)}
.badge.blue,.badge.green,.badge.amber,.badge.red{border-color:transparent}.badge.blue:before,.badge.green:before,.badge.amber:before,.badge.red:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge.blue{color:var(--accent);background:var(--accentSoft);border-color:var(--accentLine)}.badge.green{color:var(--green);background:var(--greenSoft);border-color:var(--greenLine)}.badge.amber{color:var(--amber);background:var(--amberSoft);border-color:var(--amberLine)}.badge.red{color:var(--red);background:var(--redSoft);border-color:var(--redLine)}
.badge.effect{background:var(--surface);color:var(--text2);border-color:var(--border)}.badge.effect .icon{width:13px;height:13px;color:var(--text3)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.switch{display:inline-flex;align-items:center;justify-content:flex-start;padding:2px;width:34px;height:20px;border:0;border-radius:20px;background:var(--strong);flex:none}.switch span{width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:var(--knobShadow);transition:transform .16s}.switch[aria-checked=true]{background:var(--accent)}.switch[aria-checked=true] span{transform:translateX(14px);background:var(--onAccent)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none}@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Glossary terms (beginner hints) ---------- */
.term{border-bottom:1px dashed var(--strong);cursor:help;position:relative;display:inline}
.term:hover:after,.term:focus-visible:after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 7px);width:max-content;max-width:min(280px,70vw);padding:8px 11px;border-radius:8px;background:var(--tooltipBg);color:var(--tooltipText);font-size:12px;font-weight:400;line-height:1.55;letter-spacing:0;white-space:normal;text-align:left;text-transform:none;z-index:40;box-shadow:var(--shadow);pointer-events:none}
html[data-guide=off] .term{border-bottom:0;cursor:inherit}html[data-guide=off] .term:after{display:none}

/* ---------- Review bar (demo controls) ---------- */
.reviewbar{padding:9px 24px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}.review-brand{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650}.review-brand .icon{color:var(--accent);width:17px}
.reviewbar label{display:flex;align-items:center;gap:7px;color:var(--text2);font-size:12px}.reviewbar select{padding:4px 26px 4px 9px;min-height:29px;border:1px solid var(--border);border-radius:7px;background:var(--surface2);color:var(--text);max-width:185px}.reviewbar select:hover{border-color:var(--strong)}
.review-note{font-size:11px;color:var(--text3);margin-left:auto}.reviewbar .divider{height:20px;width:1px;background:var(--border)}

/* ---------- Window frame ---------- */
.stage{max-width:1440px;margin:28px auto;padding:0 28px 36px}
.window{display:flex;min-height:790px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadowSm);overflow:clip}
.host-nav{width:188px;flex:none;background:var(--surface2);border-right:1px solid var(--border);padding:24px 12px;display:flex;flex-direction:column;gap:3px}.host-title{padding:0 12px 18px;font-size:12px;font-weight:650;color:var(--text3);letter-spacing:.8px}
.host-item{display:flex;align-items:center;gap:10px;padding:8px 12px;color:var(--text2);border-radius:8px;font-size:13px}.host-item .icon{width:16px;height:16px;color:var(--text3)}.host-item.current{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadowSm)}.host-item.current .icon{color:var(--accent)}
.host-note{margin-top:auto;padding:40px 12px 0;color:var(--text3);font-size:11px}
.workspace{min-width:0;flex:1;padding:24px 36px 0;position:relative}
.workspace[aria-busy=true]:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent) no-repeat;background-size:35% 100%;animation:busy 1.1s linear infinite;z-index:5}@keyframes busy{from{background-position:-40% 0}to{background-position:140% 0}}
.workspace-header{display:flex;gap:12px;align-items:center}.workspace-header p{margin-top:1px;color:var(--text3);font-size:var(--fs-help)}
.brand-mark{width:38px;height:38px;border:1px solid var(--accentLine);border-radius:10px;display:grid;place-items:center;color:var(--accent);background:var(--accentSoft)}.brand-mark .icon{width:21px;height:21px}
.head-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--border);margin-top:20px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;overscroll-behavior-x:contain}
.tab{flex:none;border:0;border-bottom:2px solid transparent;background:none;padding:10px 1px 11px;font-size:13px;font-weight:550;color:var(--text2);display:flex;align-items:center;gap:7px;white-space:nowrap;margin-bottom:-1px}.tab .icon{width:16px;height:16px}.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-color:var(--accent);font-weight:650}
.tab-count{min-width:18px;border-radius:999px;background:var(--accentSoft);color:var(--accent);font-size:10px;line-height:17px;padding:0 5px;text-align:center;font-weight:700}
.tab .badge{line-height:16px;padding:0 5px}.tab .badge:before{display:none}
.page{padding:26px 0 30px;min-height:640px}.page:focus{outline:0}

/* ---------- Page heading, tips, effect timing ---------- */
.page-heading{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;flex-wrap:wrap}.page-heading>.grow{min-width:240px}.page-heading p{margin-top:5px;color:var(--text2);font-size:var(--fs-body);max-width:70ch}.page-heading .head-side{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:4px}
.tip{display:flex;align-items:flex-start;gap:11px;padding:11px 12px 11px 14px;margin-bottom:20px;border:1px dashed var(--accentLine);border-radius:9px;background:var(--surface);font-size:13px;color:var(--text2)}.tip>.icon{color:var(--accent);margin-top:2px;width:17px;height:17px}.tip strong{color:var(--text);font-weight:600;margin-right:6px}.tip .pitfall{display:block;margin-top:3px;color:var(--text3);font-size:var(--fs-help)}.tip .icon-btn{margin:-3px -4px -3px 0;padding:4px}
html[data-guide=off] .tip{display:none}

/* ---------- Cards ---------- */
.card{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:var(--pad-card)}
.card-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}.card-head p{font-size:var(--fs-help);color:var(--text3);margin-top:2px}.card-head>.icon{color:var(--text3);margin-top:2px}
.columns{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}.card,.rule-layout>div{min-width:0}

/* ---------- Status: notices, state blocks ---------- */
.notice{--tone:var(--text2);--toneSoft:var(--surface2);--toneLine:var(--border);display:flex;align-items:flex-start;gap:12px;padding:12px 14px 12px 12px;border:1px solid var(--toneLine);border-left:3px solid var(--tone);border-radius:9px;background:var(--toneSoft);font-size:13px;color:var(--text)}
.notice-icon{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface);color:var(--tone);box-shadow:0 0 0 1px var(--toneLine)}.notice-icon .icon{width:15px;height:15px;stroke-width:2}
.notice strong{font-weight:640;color:var(--tone);display:block;line-height:26px}.notice p{color:var(--text2);margin-top:1px;font-size:var(--fs-help)}.notice .row{margin-top:10px;gap:8px}.notice .grow{min-width:0}
.notice-data{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:var(--fs-help);color:var(--text)}.notice-data .icon{width:14px;height:14px;color:var(--green)}
.notice.info{--tone:var(--accent);--toneSoft:var(--accentSoft);--toneLine:var(--accentLine)}.notice.warn{--tone:var(--amber);--toneSoft:var(--amberSoft);--toneLine:var(--amberLine)}.notice.error{--tone:var(--red);--toneSoft:var(--redSoft);--toneLine:var(--redLine)}.notice.success{--tone:var(--green);--toneSoft:var(--greenSoft);--toneLine:var(--greenLine)}.notice.loading{--tone:var(--text2);--toneSoft:var(--surface2);--toneLine:var(--border)}
.state{--tone:var(--text3);--toneSoft:var(--surface2);--toneLine:var(--border);display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:44px 24px 40px;border:1px dashed var(--toneLine);border-radius:12px;background:var(--surface)}
.state.error,.state.warn,.state.loading{border-style:solid;background:linear-gradient(180deg,var(--toneSoft),var(--surface) 72%)}
.state.error{--tone:var(--red);--toneSoft:var(--redSoft);--toneLine:var(--redLine)}.state.warn{--tone:var(--amber);--toneSoft:var(--amberSoft);--toneLine:var(--amberLine)}.state.loading{--tone:var(--accent);--toneSoft:var(--accentSoft);--toneLine:var(--accentLine)}
.state-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--toneSoft);color:var(--tone);margin-bottom:6px;box-shadow:0 0 0 1px var(--toneLine)}.state-icon .icon{width:24px;height:24px}
.state h3{font-size:var(--fs-section)}.state.error h3{color:var(--red)}.state p{font-size:13px;color:var(--text2);max-width:46ch}
.state .notice-data{justify-content:center;margin-top:2px}
.state-actions{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:12px}
.state-extra{width:100%;max-width:520px;text-align:left;margin-top:16px}
.state.compact{padding:28px 18px;border:0;background:none}

/* ---------- Overview ---------- */
.flow{list-style:none;margin:0 0 24px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.flow li{--tone:var(--border);padding:10px 12px 0;border-top:3px solid var(--tone);display:flex;gap:9px;align-items:flex-start;min-width:0}
.flow .flow-num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;border:1px solid var(--strong);color:var(--text3);background:var(--surface)}.flow .flow-num .icon{width:13px;height:13px;stroke-width:2.4}
.flow strong{display:block;font-size:var(--fs-label);font-weight:600;color:var(--text2);line-height:22px}.flow span.sub{display:block;font-size:var(--fs-micro);color:var(--text3);overflow-wrap:anywhere}
.flow li.done{--tone:var(--green)}.flow li.done .flow-num{background:var(--green);border-color:var(--green);color:var(--surface)}
.flow li.current{--tone:var(--accent)}.flow li.current .flow-num{border-color:var(--accent);color:var(--accent);background:var(--accentSoft);box-shadow:0 0 0 3px var(--accentSoft)}.flow li.current strong{color:var(--text)}
.flow li.blocked{--tone:var(--red)}.flow li.blocked .flow-num{border-color:var(--red);background:var(--redSoft);color:var(--red)}.flow li.blocked strong,.flow li.blocked .sub{color:var(--red)}
.action-card{--tone:var(--accent);--toneSoft:var(--accentSoft);--toneLine:var(--accentLine);padding:24px 26px;border:1px solid var(--toneLine);border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--toneSoft),var(--surface) 62%)}
.action-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tone)}
.action-card.warn{--tone:var(--amber);--toneSoft:var(--amberSoft);--toneLine:var(--amberLine)}.action-card.error{--tone:var(--red);--toneSoft:var(--redSoft);--toneLine:var(--redLine)}.action-card.ok{--tone:var(--green);--toneSoft:var(--greenSoft);--toneLine:var(--greenLine)}
.action-eyebrow{display:flex;align-items:center;gap:8px;color:var(--tone);font-size:var(--fs-help);font-weight:650}.action-eyebrow .icon-wrap{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:0 0 0 1px var(--toneLine)}.action-eyebrow .icon{width:14px;height:14px;stroke-width:2.1}
.action-card h2{font-size:20px;margin:12px 0 6px;letter-spacing:-.3px}.action-card p{font-size:13px;color:var(--text2);max-width:60ch}.action-card .row{margin-top:20px}

/* 通栏 Hero 主行动卡片与 1:1 双栏平衡网格 */
.hero-card{--tone:var(--accent);--toneSoft:var(--accentSoft);--toneLine:var(--accentLine);padding:20px 24px;border:1px solid var(--toneLine);border-left:4px solid var(--tone);border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(90deg,var(--toneSoft),var(--surface) 45%);display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}
.hero-card.warn{--tone:var(--amber);--toneSoft:var(--amberSoft);--toneLine:var(--amberLine)}.hero-card.error{--tone:var(--red);--toneSoft:var(--redSoft);--toneLine:var(--redLine)}.hero-card.ok{--tone:var(--green);--toneSoft:var(--greenSoft);--toneLine:var(--greenLine)}
.hero-left{display:flex;align-items:center;gap:16px;min-width:0}
.hero-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--toneLine);color:var(--tone);box-shadow:0 2px 8px color-mix(in srgb,#000 6%,transparent);flex-shrink:0}
.hero-icon .icon{width:24px;height:24px}
.hero-texts{display:flex;flex-direction:column;gap:4px;min-width:0}
.hero-eyebrow{display:flex;align-items:center;gap:6px;color:var(--tone);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.hero-card h2{font-size:18px;margin:0;font-weight:700;color:var(--text);letter-spacing:-.2px}
.hero-card p{font-size:13px;color:var(--text2);margin:0;line-height:1.5}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex-shrink:0}
.btn-hero{min-height:38px;padding:8px 18px;font-size:13px;font-weight:600}
.balanced-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
.timing-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:var(--fs-help);color:var(--text2);margin-top:4px}
.timing-grid .key{color:var(--text3);font-weight:550}
@media (max-width:860px){
  .hero-card{flex-direction:column;align-items:flex-start;gap:16px}
  .hero-right{width:100%;align-items:flex-start}
  .balanced-grid{grid-template-columns:1fr}
}
.guide{padding:4px var(--pad-card)}.guide-title{padding:14px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.guide-progress{display:flex;align-items:center;gap:10px;font-size:var(--fs-help);color:var(--text3)}.guide-bar{width:72px;height:5px;border-radius:5px;background:var(--surface3);overflow:hidden}.guide-bar span{display:block;height:100%;background:var(--green);border-radius:5px}

.guide-item strong{display:block;font-size:var(--fs-label);font-weight:600}.guide-item p{font-size:var(--fs-help);color:var(--text3);margin-top:2px}.guide-item .link{margin-left:auto;flex:none;align-self:center;font-size:12px}
.summary-list{display:flex;flex-direction:column}.summary-row{display:flex;align-items:flex-start;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}.summary-row:last-child{border-bottom:0;padding-bottom:0}.summary-row:first-child{padding-top:0}.summary-row>.icon{color:var(--text3);margin-top:2px}
.summary-row .label{font-size:var(--fs-help);color:var(--text3);margin-bottom:1px}.summary-row strong{font-size:var(--fs-label);font-weight:600}.summary-row p{font-size:var(--fs-help);color:var(--text2);margin-top:2px}.summary-row .switch{margin-top:4px}.summary-row .link{margin-top:2px}

.dialog-body .file-list{max-height:220px;overflow:auto}
.sticky-footer{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;background:var(--surface);border-top:1px solid var(--border);box-shadow:var(--shadowUp);margin-top:24px}.sticky-footer .foot-copy{flex:1;min-width:180px;font-size:var(--fs-help);color:var(--text3)}.sticky-footer .foot-copy strong{display:block;color:var(--text);font-size:var(--fs-label);font-weight:620}.sticky-footer .foot-copy.blocked strong{color:var(--red)}

/* ---------- Prompt modes & editors ---------- */

.dock-trigger:hover{border-color:var(--strong);color:var(--text)}.dock-trigger[aria-expanded=true]{border-color:var(--accent);background:var(--accentSoft);color:var(--accent)}.dock-trigger[aria-expanded=true] .chev{transform:rotate(-90deg)}
.dock-panel{position:absolute;top:84px;right:30px;width:370px;max-width:calc(100% - 32px);max-height:calc(100% - 330px);min-height:300px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--strong);border-radius:12px;box-shadow:var(--shadowPop);z-index:6;overflow:hidden;animation:pop .18s ease-out}

.dock-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:14px 16px 16px;background:linear-gradient(var(--surface) 30%,transparent) top/100% 24px no-repeat local,linear-gradient(transparent,var(--surface) 70%) bottom/100% 24px no-repeat local,linear-gradient(var(--scrollShade),transparent) top/100% 14px no-repeat scroll,linear-gradient(transparent,var(--scrollShade)) bottom/100% 14px no-repeat scroll;background-color:var(--surface)}

.dock-panel .mode-grid{gap:8px;margin-top:10px}.dock-panel .mode-card{padding:10px 12px;gap:3px;box-shadow:none}.dock-panel .mode-card h3{font-size:13px}.dock-panel .mode-card .row{gap:4px}.dock-panel .mode-card p{font-size:var(--fs-micro);color:var(--text3)}
.dock-footer{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--border);background:var(--surface2);font-size:var(--fs-micro);color:var(--text3)}
.alias-row{display:flex;align-items:center;gap:7px;font-size:var(--fs-help);padding:7px 0;border-bottom:1px solid var(--border);overflow-wrap:anywhere}.alias-row>span:first-child{flex:1;min-width:0}.alias-row .icon-btn{padding:4px}.alias-row .icon{width:15px;height:15px}

/* ---------- Words ---------- */

.word-actions{display:flex;gap:2px;flex:none}.word-actions .icon-btn{padding:6px}.word-actions .icon{width:16px;height:16px}.word-actions [data-word-delete]:hover:not(:disabled){color:var(--red);background:var(--redSoft)}

.word-stale{opacity:.6;filter:saturate(.4)}
.word-inline-error{font-size:var(--fs-micro);color:var(--text3);margin-top:7px;overflow-wrap:anywhere}.word-inline-error.has-error{color:var(--red)}
.word-capacity{font-size:var(--fs-micro);color:var(--text3);font-variant-numeric:tabular-nums}

/* ---------- Dialog, toast ---------- */
dialog{padding:0;width:min(560px,calc(100vw - 32px));max-height:85vh;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);box-shadow:var(--shadowPop)}dialog[open]{animation:pop .16s ease-out}dialog::backdrop{background:var(--overlay)}
#dialog-content{display:flex;flex-direction:column;max-height:85vh;min-height:0}

// Four-stage progress derived from the same state as currentAction(), so every scene lands on exactly one stage.
function flowSteps(){

 const s2=!S.root?'todo':chosen?'done':'current';

 const s4=S.restart?'current':s3==='done'?'done':'todo';
 return [['配置宿主目录',s1,s1==='done'?'已找到宿主源码':'告诉插件源码在哪'],['选择补丁',s2,chosen?`已选 ${chosen} 条`:s2==='todo'?'配置目录后进行':'还没有选择'],['检查并应用',s3,s3==='blocked'?'预检未通过，未写入':S.restart==='revert'?'已回退源码':s3==='done'?'已写入磁盘':s3==='current'?`待写入 ${count} 个文件`:'选好补丁后进行'],['重启宿主',s4,s4==='current'?'等你按原方式重启':s4==='done'?'已完成':'应用后进行']];
}

 case 'wordsRetryRead':{S.wordReadLoading=true;const token=++operation;render();setTimeout(()=>{if(token!==operation)return;S.wordReadLoading=false;S.wordsReadError=false;S.wordNotice={title:'词库已重新读取',body:'现在可以继续管理词条与本地预览。',tone:'success'};render();announce('词库已重新读取')},650);break;}
 case 'surface':S.chat=!S.chat;S.dockOpen=S.chat;render();break;
 case 'openSettings':S.chat=false;S.dockOpen=false;render(true);break;
 case 'closeSettings':guardDraft(()=>{S.chat=true;S.dockOpen=false;render()});break;
 case 'toggleDock':S.dockOpen=!S.dockOpen;render();if(S.dockOpen)$('#dock-panel .icon-btn')?.focus();else $('.dock-trigger')?.focus();break;
 case 'demoSend':toast('这是会话布局预览，不会发送消息');break;
 case 'reset':guardDraft(()=>{resetScene();toast('已重置演示')});break;
 case 'toggleGuide':S.guide=!S.guide;render();break;
 case 'takeover':S.takeover=!S.takeover;render();toast(S.takeover?'本次运行的接管已开启':'接管已暂停；磁盘补丁保持原状');break;
 case 'refresh':if(S.refreshing)break;S.refreshing=true;render();setTimeout(()=>{S.refreshing=false;S.checked='刚刚';render();toast(S.blocked?'仍有源码冲突，请核对具体原因':!S.root?'仍未配置宿主目录':S.restart?'磁盘已检查；仍需按步骤重启宿主':'检查完成')},600);break;
 case 'apply':{if(!S.root||S.blocked||!pendingFiles().length)break;const n=pendingFiles().length;showDialog({title:`将修改 ${n} 个宿主源码文件`,body:`<p>以下文件会先保存快照，再整批检查并写入。检查不一致就停止，不会只写一半；写入失败会尝试回滚。</p>${fileList(pendingFiles())}${notice('会影响同一源码树下的其他 profile','独立 profile 隔离配置，但不隔离共享的宿主源码。','warn')}`,yes:`确认应用 · ${n} 个文件`,consequence:{ok:true,text:'可以撤销：之后用「回退已应用补丁」按快照恢复'},ack:'我知道写入后要重启宿主才生效，并且会影响共用这份源码的其他 profile',onAccept:()=>simulate(()=>{for(const p of enabledPatches())S.applied.add(p.id);S.diskMode=S.mode;S.restart='apply';S.guide=false;toast('模拟写入完成，接下来重启宿主')},`正在写入 ${n} 个文件…`)});break}
 case 'revert':{if(!S.applied.size||S.blocked||!S.root)break;const n=appliedFiles().length;showDialog({title:'恢复上次应用前的源码？',body:`<p>按应用记录恢复 ${n} 个文件，与当前开关选择无关。若任一文件有外部改动，将整体拒绝回退，不会只恢复一部分。</p>${fileList(appliedFiles())}${notice('完成后仍要重启宿主','提示词正文与用户规则会保留，回退只处理已记录的源码补丁。','warn')}`,yes:'确认回退',danger:true,consequence:{ok:true,text:'可以撤销：之后重新应用即可'},ack:`我知道这会恢复全部 ${n} 个已应用文件，之后要重启宿主`,onAccept:()=>simulate(()=>{S.applied.clear();S.restart='revert';toast('模拟回退完成，请重启宿主')},'正在恢复源码…')});break}
 case 'restartHelp':showDialog({title:'按原来的方式重启宿主',body:`<p>刷新浏览器页面不会重新加载正在运行的宿主代码。</p><ol class="small muted"><li>保存会话工作，回到启动该 profile 的终端。</li><li>按 <kbd class="kbd">Ctrl+C</kbd> 停止你启动的宿主进程。</li><li>在同一个终端，按原命令启动同一 profile。</li><li>重新打开登录链接，再检查插件状态。</li></ol><div class="path">请使用你原来的启动命令；此原型不生成或执行宿主命令。</div><div class="success-sign"><strong>成功的样子</strong>重新打开设置后，概览页的进度条四段全绿，卡片显示「所选补丁已在磁盘上就位」。</div>${notice('本页无法核实是否已经重启','“磁盘已就位”只检查源码文件。下面的按钮仅模拟完成这一步，不代表实际宿主验收。','warn')}`,yes:'模拟已重启，查看后续状态',onAccept:()=>{S.restart=null;S.guide=false;render();toast('已切换到模拟重启后的界面')}});break;
 case 'configureRoot':showDialog({title:'配置宿主源码目录',body:'<p>在原启动器中传入宿主根目录，然后重启同一 profile。不要通过修改校验值跳过版本检查。</p><div class="path">$env:DSH_BREAKLIMIT_HOST_ROOT = &apos;D:\\你的目录\\deepseek-harness&apos;</div><p class="small muted mt">上面是 PowerShell 示例，请替换路径。原型只演示配置后的状态，不执行命令。</p>',yes:'模拟已配置并重新检查',onAccept:()=>{S.root=true;render();toast('示例宿主目录已配置')}});break;
 case 'blockedHelp':showDialog({title:'一处源码无法安全应用',body:`<p>演示原因：读文件模块的内容不再匹配绑定版本。</p>${fileList(['packages/fs/tool-fs/src/read.ts'])}<ol class="small muted"><li>核对宿主版本 0.2.1-rc.2 与绑定提交。</li><li>检查源码差异及已有应用记录。</li><li>保留自己的修改，确认来源后再处理。</li></ol>${notice('不要直接覆盖或重新采集哈希','这会隐藏版本差异，无法证明补丁适配正确。','warn')}`,yes:'模拟问题已处理，重新检查',onAccept:()=>{S.blocked=false;render();toast('模拟预检通过')}});break;
 case 'savePrompt':{if(!promptDirty()||S.readError||!promptValue().trim())break;const submitted=promptValue();simulate(()=>{if(S.failSave){S.failSave=false;S.promptNotice={title:'正文保存失败，草稿已保留',body:'示例原因：文件暂时无法写入。确认文件未被占用后，可以再次保存。',tone:'error'};return}S.savedPrompt=submitted;S.promptCustom=true;if(S.promptDraft===submitted)S.promptDraft=null;S.promptNotice={title:promptDirty()?'已保存提交内容；还有新的未保存修改':'正文已保存',body:promptDirty()?'保存期间输入的内容仍在编辑器中，继续编辑或再次保存。':'从下一轮对话开始使用你的正文。',tone:promptDirty()?'warn':'success'};toast('正文已保存')},'正在保存正文…');break}
 case 'discardPrompt':if(promptDirty())showDialog({title:'放弃正文修改？',body:'<p>恢复到上次保存的内容，当前未保存的输入会丢失。</p>',yes:'放弃修改',danger:true,onAccept:()=>{S.promptDraft=null;S.promptNotice=null;render()}});break;
 case 'resetPrompt':if(S.readError||!S.promptCustom)break;showDialog({title:'删除自定义正文，恢复内置？',body:`<p>你保存的正文会被删除。两档模式的附加段保持不变。</p><div class="row mt">${btn(icon('copy')+'先复制全文留作备份','copyPrompt','sm')}</div>`,yes:'删除并恢复内置',danger:true,consequence:{text:'此操作无法撤销，删除的正文无法直接找回'},ack:'我已复制备份，或确认不再需要这份正文',onAccept:()=>{S.savedPrompt=builtin;S.promptCustom=false;S.promptDraft=null;S.promptNotice={title:'已恢复内置正文',body:'从下一轮对话生效。',tone:'success'};render()}});break;
 case 'copyPrompt':try{if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(promptValue());toast('正文已复制')}catch{$('#prompt-text')?.focus();$('#prompt-text')?.select();toast('浏览器未允许复制，正文已选中，请按 Ctrl+C')}break;
 case 'retryRead':S.readError=false;S.promptNotice={title:'正文已重新读取',body:'现在可以查看、编辑与保存。',tone:'success'};render();break;
 case 'newRule':newRule();break;
 case 'editCurrent':if(selectedRule())editRule(selectedRule().id);break;
 case 'activeCurrent':{const r=selectedRule();if(r){S.active===r.id?deactivateRule():activateRule(r.id)}break}
 case 'deleteCurrent':removeRule(selectedRule());break;
 case 'activateSaved':if(S.ruleNotice?.activate)activateRule(S.ruleNotice.activate);break;
 case 'cancelRule':{const cancel=()=>{S.editing=null;render()};ruleDirty()?confirmDiscardRule(cancel):cancel();break}
 case 'saveRule':{if(validateRule()||!ruleDirty())break;const submitted={...ruleFields(S.editing)},original=JSON.stringify(ruleFields(S.editing));const save=()=>simulate(()=>{if(S.failSave){S.failSave=false;S.ruleNotice={title:'保存失败，草稿已保留',body:'示例写入失败，请检查后重试。',tone:'error'};return}S.selectedRuleId=submitted.id;const index=S.rules.findIndex(r=>r.id===submitted.id);index===-1?S.rules.push(submitted):S.rules.splice(index,1,submitted);if(S.editing&&JSON.stringify(ruleFields(S.editing))===original)S.editing=null;else if(S.editing?.id===submitted.id){S.editing.baseline={...submitted};S.editing.isNew=false;S.editing.originalId=submitted.id}S.ruleNotice={title:S.active===submitted.id?'规则已保存并同步到写入文件':'规则已保存，还没有激活',body:S.active===submitted.id?`已模拟同步到 ${submitted.target}。`: '保存不会自动生效，激活后才会写入指令文件。',tone:'success',activate:S.active===submitted.id?null:submitted.id};toast('规则已保存')},'正在保存规则…');if(S.editing.isNew&&S.rules.some(r=>r.id===submitted.id))showDialog({title:`覆盖已有规则「${esc(submitted.id)}」？`,body:'<p>名称、正文和目标文件会替换原规则；旧正文无法直接找回。如果想保留两份，请取消后修改 ID。</p>',yes:'确认覆盖',danger:true,consequence:{text:'旧正文会被替换，无法直接找回'},ack:'我确认用新内容覆盖这条规则',onAccept:save});else save();break}
 case 'recoverRules':showDialog({title:'备份并重置规则清单？',body:'<p>先把损坏的 rules.json 单独备份，再建立空清单。</p><ul class="small muted" style="padding-left:18px;margin:10px 0 0;display:grid;gap:4px"><li><strong>会保留：</strong>bodies/ 下的规则正文、原 rules.json 的备份</li><li><strong>不会自动找回：</strong>规则名称、激活状态、指令文件的恢复关系</li></ul>'+notice('重建同名规则前先备份正文','同 ID 保存会覆盖 bodies/ 下的原正文。','warn'),yes:'备份并重置',danger:true,confirmWord:'重置',consequence:{text:'重置后，原清单里的名称与激活关系无法在界面中恢复'},onAccept:()=>simulate(()=>{S.corrupt=false;S.rules=[];S.active=null;S.editing=null;S.ruleNotice={title:'已备份原清单，并重置为空清单',body:'演示备份位置：$DSH_HOME/dsh-breaklimit-backup/示例恢复批次/rules.json。原正文仍在 bodies/ 中；请先核对与备份，再创建规则。',tone:'success'};toast('模拟恢复完成，原正文保留')},'正在备份清单…')});break;
 case 'recoveryHelp':showDialog({title:'哪些数据仍然保留？',body:'<p>损坏的清单会在重置前单独备份，正文文件仍保留。不要把空清单当作旧规则已经恢复，也不要在未备份前保存同 ID 的新规则。</p><div class="path">$DSH_HOME/breaklimit/bodies/&lt;规则 ID&gt;.md<br>$DSH_HOME/dsh-breaklimit-backup/&lt;恢复批次&gt;/rules.json</div>'});break;
 case 'rulesHelp':showDialog({title:'保存、激活和取消激活',body:'<p><strong>保存：</strong>保留规则正文，未激活的新规则不会改动指令文件。</p><p class="mt small muted"><strong>激活：</strong>先备份目标文件，再写入规则，同一时间仅激活一条。</p><p class="mt small muted"><strong>取消激活：</strong>目标未被外部改动时恢复原文；外部修改会保留并报告。</p>'});break;
 case 'promptHelp':showDialog({title:'共用正文是什么？',body:'<p>这是两档提示词模式共用的附加指令。保存自定义版本后替换内置正文，模式特有的附加段仍然保留。</p><p class="small muted mt">原型中的正文仅用于评审编辑体验，不代表插件的完整内置提示词。</p>'});break;
 case 'guideHelp':showDialog({title:'从配置到生效',body:'<p>先选择提示词模式，再挑选源码补丁。应用前检查影响与快照，应用后重启同一宿主。</p><div class="info-grid"><div><span>源码补丁</span>写源码，重启宿主后加载</div><div><span>提示词正文与模式</span>下一轮对话生效</div><div><span>长期规则</span>激活后写入指令文件</div><div><span>运行时接管</span>立即生效，不撤销源码补丁</div></div>'+notice('推荐模式不是权限开关','实际执行权限由宿主沙箱档位决定。示例环境为完全权限。','warn')});break;
 case 'tipDismiss':S.tips[target.dataset.tipPage]=true;render();$('#main')?.focus({preventScroll:true});break;
 case 'copyDiagnostics':{const node=$('#diag-text');try{if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(node.innerText);toast('诊断信息已复制，不含凭据')}catch{const range=document.createRange();range.selectNodeContents(node);getSelection().removeAllRanges();getSelection().addRange(range);toast('浏览器未允许复制，诊断信息已选中，请按 Ctrl+C')}break}
 case 'addAlias':addDockWord();break;
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dialog').open&&S.dockOpen){S.dockOpen=false;render();$('.dock-trigger')?.focus()}if(e.key==='Enter'&&['word-from','word-to'].includes(e.target.id)){e.preventDefault();requestWordSave()}if(e.key==='Enter'&&['alias-from','alias-to'].includes(e.target.id)){e.preventDefault();$('[data-action=addAlias]')?.click()}});
window.addEventListener('resize',revealSelectedTab);
window.addEventListener('beforeunload',e=>{if(anyDirty()){e.preventDefault();e.returnValue=''}});
S=initial();applyTheme();applyViewPrefs();render();
</script>
</body>
</html>
