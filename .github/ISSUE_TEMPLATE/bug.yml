name: 问题报告 / Bug report
description: 提供可复现步骤和脱敏证据
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿粘贴 token、完整配置、私人规则或完整会话。安全问题先阅读 SECURITY.md。English reports are welcome.
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索已有 Issue（包括已关闭的），没有重复
          required: true
        - label: 已核对 README 的宿主版本与支持范围
          required: true
        - label: 这个 Issue 只报告一个问题
          required: true
  - type: dropdown
    id: ai_usage
    attributes:
      label: AI 使用说明 / AI disclosure
      description: 如实说明 AI 的用途；AI 发现的问题尚未复现时请注明。
      options:
        - 没有使用 AI
        - 只用 AI 整理或翻译文字，问题是我自己遇到的
        - 问题由 AI 发现或分析，我已自己确认
        - 问题由 AI 发现或分析，我还没有自己确认
    validations:
      required: true
  - type: input
    id: ai_model
    attributes:
      label: 使用的 AI 工具和模型
      description: 使用 AI 时填写具体工具、模型版本和用途；未使用可留空。
  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      options:
        - 安装或启动
        - 补丁预检、应用或回退
        - 提示词或规则
        - 审批与沙箱档位
        - 界面显示或操作
        - 其他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 插件提交、宿主版本与提交、Node 版本、系统、Web 或其他启动方式。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 执行目录、命令或界面操作；从哪一步开始出现问题。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 界面或命令实际显示什么，错误请照原文脱敏提供。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏输出
      description: 最小必要的错误信息，以及你已检查的项目。
