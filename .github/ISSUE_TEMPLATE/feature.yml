name: 功能建议 / Feature request
description: 描述使用场景和成功标准
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: English requests are welcome. 大的改动先讨论使用场景与范围。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索已有 Issue（包括已关闭的），没有重复
          required: true
        - label: 这个 Issue 只讨论一个需求
          required: true
  - type: dropdown
    id: ai_usage
    attributes:
      label: AI 使用说明 / AI disclosure
      options:
        - 没有使用 AI
        - 只用 AI 整理或翻译文字
        - 建议内容主要由 AI 生成或分析
    validations:
      required: true
  - type: input
    id: ai_model
    attributes:
      label: 使用的 AI 工具和模型
      description: 使用 AI 时填写具体工具、模型版本和用途；未使用可留空。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 当前做法、限制和目标用户。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 期望结果
      description: 可观察的成功标准，以及是否涉及新宿主版本或部署方式。
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: 现在的替代办法
      description: 目前怎样处理，或者为什么现有功能不够用。
