name: Prepare draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (v<package version>)
        required: true
        type: string
      source_sha:
        description: Full 40-character source commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  source:
    uses: ./.github/workflows/check.yml
    with:
      source_ref: ${{ inputs.source_sha }}

  package:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the reviewed main workflow
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Package the exact tagged commit and its release notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node tools/release.mjs pack . "$RELEASE_TAG" "$SOURCE_SHA" release-assets
          git show "$SOURCE_SHA:docs/releases/${RELEASE_TAG#v}.md" > release-notes.md
          test -s release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: |
            release-assets/
            release-notes.md
          if-no-files-found: error

  draft:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: prepared
      - name: Create or resume the draft without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node tools/github-release.mjs prepare . "$RELEASE_TAG" "$SOURCE_SHA" prepared/release-assets prepared/release-notes.md
